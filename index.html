<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AI Contract Reviewer - Login</title>

    <!-- Global Theme -->
    <link rel="stylesheet" href="./css/theme.css" />

    <!-- Login Page Style -->
    <link rel="stylesheet" href="./css/components/button.css" />
    <link rel="stylesheet" href="./css/components/card.css" />
    <link rel="stylesheet" href="./css/components/input.css" />
    <link rel="stylesheet" href="./css/login.css" />
  </head>

  <body>
    <main class="login-container">
      <!-- Branding Section -->

      <section class="brand-section">
        <div class="brand-logo">AI</div>

        <h1>AI Contract Reviewer</h1>

        <p>
          Analyze contracts intelligently with AI-powered risk detection and
          insights.
        </p>

        <div class="feature-list">
          <span> ✓ AI Contract Analysis </span>

          <span> ✓ Risk Detection </span>

          <span> ✓ Smart Legal Insights </span>
        </div>
      </section>

      <!-- Login Card -->

      <section class="card card-glass login-card">
        <div class="login-header">
          <h2>Welcome Back</h2>

          <p>Login to continue your workspace</p>
        </div>

        <form id="login-form">
          <div class="input-group">
            <label class="input-label"> Email </label>

            <input
              class="input"
              id="email"
              type="email"
              placeholder="Enter your email"
            />
          </div>

          <div class="input-group">
            <label class="input-label"> Password </label>

            <input
              class="input"
              id="password"
              type="password"
              placeholder="Enter your password"
            />
          </div>

          <button type="submit" class="btn btn-primary" id="loginButton">
            Login
          </button>

          <p id="login-message" class="login-message"></p>
        </form>
      </section>
    </main>

    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
  </body>
</html>
